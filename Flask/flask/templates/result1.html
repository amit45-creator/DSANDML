
<!DOCTYPE html>
<html>
<head>
    <title>Final Results</title>

    <style>
        table {
            border: 2px solid black;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;
            padding: 5px;
            text-align: center;
        }
    </style>

</head>
<body>

    <h1>Final Results</h1>

    <table>
        {% for key, value in result.items() %}
        <tr>
            <th>{{ key }}</th>
            <td>{{ value }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
